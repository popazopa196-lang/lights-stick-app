<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lights Stick App — Пульт</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #0a0f1e;
            margin: 0;
            padding: 16px;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #11161f;
            border-radius: 40px;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 1.6rem;
            margin: 0 0 8px;
        }
        .room-info {
            background: #0c1018;
            border-radius: 24px;
            padding: 20px;
            margin: 16px 0;
        }
        .guest-link {
            background: #00000066;
            padding: 12px;
            border-radius: 60px;
            font-size: 0.9rem;
            word-break: break-all;
            font-family: monospace;
            margin-bottom: 16px;
        }
        .room-code {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 8px;
            background: #1e2a3a;
            padding: 12px;
            border-radius: 32px;
            font-family: monospace;
            margin: 10px 0;
        }
        .instruction {
            font-size: 0.85rem;
            color: #8e9aaf;
            margin-top: 12px;
        }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .color-btn {
            border: none;
            border-radius: 60px;
            padding: 14px 0;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .color-btn:active {
            transform: scale(0.96);
        }
        .flash-btn {
            background: #ff9500;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .counter {
            background: #00000044;
            border-radius: 60px;
            padding: 10px;
            margin-top: 16px;
        }
        .refresh-btn {
            background: #2a3a50;
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            margin-top: 10px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✨ Lights Stick App</h1>
    <p>Пульт организатора</p>

    <div class="room-info">
        <div style="margin-bottom: 8px;">🔗 Ссылка для гостей:</div>
        <div class="guest-link" id="guestUrlDisplay">Загрузка...</div>
        
        <div style="margin: 16px 0 8px;">🎫 Код комнаты (введите вручную):</div>
        <div class="room-code" id="roomCode">1234</div>
        
        <div class="instruction">
            📱 ГОСТИ: откройте в браузере ссылку выше<br>
            или введите код комнаты на сайте<br>
            <span style="font-size:0.75rem;">а затем нажмите "Подключиться"</span>
        </div>
        <button class="refresh-btn" id="refreshCodeBtn">🔄 Новый код</button>
    </div>

    <div class="color-grid">
        <button class="color-btn" style="background:#ff3b30;" data-color="#ff3b30">🔴 КРАСНЫЙ</button>
        <button class="color-btn" style="background:#34c759;" data-color="#34c759">🟢 ЗЕЛЁНЫЙ</button>
        <button class="color-btn" style="background:#007aff;" data-color="#007aff">🔵 СИНИЙ</button>
        <button class="color-btn" style="background:#ffcc00;" data-color="#ffcc00">🟡 ЖЁЛТЫЙ</button>
        <button class="color-btn" style="background:#af52de;" data-color="#af52de">🟣 ФИОЛЕТ</button>
        <button class="color-btn" style="background:#ffffff;" data-color="#ffffff">⬜ БЕЛЫЙ</button>
    </div>

    <button class="flash-btn" id="flashBtn">📸 ВСПЫШКА (3 сек)</button>

    <div class="counter">
        📱 Гостей в зале: <span id="connectedCount">0</span>
    </div>
    <div style="font-size: 11px; margin-top: 16px;">Гости подключаются по ссылке или коду комнаты</div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
    
    // Генерация случайного 4-значного кода
    function generateRoomCode() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }
    
    let currentRoomCode = generateRoomCode();
    
    function updateRoomInfo() {
        const base = window.location.origin;
        const guestUrl = base + '/guest.html?code=' + currentRoomCode;
        document.getElementById('guestUrlDisplay').innerText = guestUrl;
        document.getElementById('roomCode').innerText = currentRoomCode;
        
        // Отправляем код на сервер, чтобы гости могли подключиться
        socket.emit('host-set-room', { code: currentRoomCode });
    }
    
    function sendCommand(mode, value) {
        socket.emit('host-command', { mode, value, roomCode: currentRoomCode });
    }
    
    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            sendCommand('color', btn.getAttribute('data-color'));
        });
    });
    
    document.getElementById('flashBtn').addEventListener('click', () => {
        sendCommand('flash', 3000);
    });
    
    document.getElementById('refreshCodeBtn').addEventListener('click', () => {
        currentRoomCode = generateRoomCode();
        updateRoomInfo();
    });
    
    socket.on('clients-update', (count) => {
        document.getElementById('connectedCount').innerText = count;
    });
    
    updateRoomInfo();
</script>
</body>
</html>
