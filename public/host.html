<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lights Stick App — Пульт</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: system-ui, sans-serif;
            background: #0a0f1e;
            margin: 0;
            padding: 16px;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: #11161f;
            border-radius: 48px;
            padding: 24px 20px;
            text-align: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .sub { color: #8e9aaf; margin-bottom: 20px; }
        .info-box {
            background: #0c1018;
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .guest-url {
            background: #00000066;
            padding: 12px;
            border-radius: 60px;
            font-size: 0.75rem;
            word-break: break-all;
            margin: 10px 0;
        }
        .start-btn {
            background: #00c853;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            width: 100%;
            cursor: pointer;
            margin: 12px 0;
        }
        .thankyou-btn {
            background: #ff9500;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            width: 100%;
            cursor: pointer;
            margin: 12px 0;
        }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .color-btn {
            border: none;
            border-radius: 60px;
            padding: 14px 0;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .strobe-btn {
            background: #ff2d55;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            width: 100%;
            cursor: pointer;
            margin: 12px 0;
        }
        .strobe-btn.active {
            background: #ff0a3a;
            animation: pulse 0.8s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
        .counter {
            background: #00000044;
            border-radius: 60px;
            padding: 14px;
            margin-top: 16px;
            font-weight: bold;
        }
        .status {
            margin-top: 16px;
            padding: 10px;
            border-radius: 28px;
            font-size: 0.85rem;
        }
        .status.connected { background: #1e3a2f; color: #4cff9e; }
        .status.disconnected { background: #3a1e1e; color: #ff6b6b; }
        .status.strobe { background: #ff2d55; animation: pulse 1s infinite; }
    </style>
</head>
<body>
<div class="container">
    <h1>✨ Lights Stick App</h1>
    <div class="sub">Пульт организатора</div>

    <div class="info-box">
        <div>🔗 Ссылка для гостей:</div>
        <div class="guest-url" id="guestUrlDisplay">Загрузка...</div>
        <div style="font-size: 0.7rem; margin-top: 8px;">📱 Гости открывают в браузере (работает через мобильный интернет)</div>
    </div>

    <button class="start-btn" id="startShowBtn">🎬 НАЧИНАЕМ (убрать текст и градиент)</button>
    <button class="thankyou-btn" id="thankyouBtn">💖 СКАЗАТЬ СПАСИБО</button>

    <div class="color-grid">
        <button class="color-btn" style="background:#ff3b30;" data-color="#ff3b30">🔴 КРАСНЫЙ</button>
        <button class="color-btn" style="background:#34c759;" data-color="#34c759">🟢 ЗЕЛЁНЫЙ</button>
        <button class="color-btn" style="background:#007aff;" data-color="#007aff">🔵 СИНИЙ</button>
        <button class="color-btn" style="background:#ffcc00;" data-color="#ffcc00">🟡 ЖЁЛТЫЙ</button>
        <button class="color-btn" style="background:#af52de;" data-color="#af52de">🟣 ФИОЛЕТ</button>
        <button class="color-btn" style="background:#ffffff;" data-color="#ffffff">⬜ БЕЛЫЙ</button>
    </div>

    <button class="strobe-btn" id="strobeBtn">⚡ СТРОБОСКОП</button>

    <div class="counter">📱 Гостей в зале: <span id="guestCount">0</span></div>
    <div id="connectionStatus" class="status disconnected">⚡ Подключение к серверу...</div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
    let isStrobeActive = false;
    
    const guestUrl = window.location.origin + '/guest.html';
    document.getElementById('guestUrlDisplay').innerText = guestUrl;
    
    socket.emit('host-connect');
    
    function sendColor(color) {
        if (isStrobeActive) {
            socket.emit('strobe-off');
            isStrobeActive = false;
            document.getElementById('strobeBtn').classList.remove('active');
            document.getElementById('connectionStatus').classList.remove('strobe');
            setTimeout(() => socket.emit('set-color', color), 50);
        } else {
            socket.emit('set-color', color);
        }
    }
    
    function toggleStrobe() {
        if (isStrobeActive) {
            socket.emit('strobe-off');
            isStrobeActive = false;
            document.getElementById('strobeBtn').classList.remove('active');
            document.getElementById('connectionStatus').classList.remove('strobe');
            document.getElementById('connectionStatus').innerHTML = '🟢 Подключено';
        } else {
            socket.emit('strobe-on');
            isStrobeActive = true;
            document.getElementById('strobeBtn').classList.add('active');
            document.getElementById('connectionStatus').classList.add('strobe');
            document.getElementById('connectionStatus').innerHTML = '⚡ СТРОБОСКОП АКТИВЕН';
        }
    }
    
    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => sendColor(btn.dataset.color));
    });
    document.getElementById('strobeBtn').addEventListener('click', toggleStrobe);
    document.getElementById('startShowBtn').addEventListener('click', () => socket.emit('start-show'));
    document.getElementById('thankyouBtn').addEventListener('click', () => socket.emit('show-thankyou'));
    
    socket.on('connect', () => {
        document.getElementById('connectionStatus').className = 'status connected';
        document.getElementById('connectionStatus').innerHTML = '🟢 Подключено';
        socket.emit('host-connect');
    });
    socket.on('connect_error', () => {
        document.getElementById('connectionStatus').className = 'status disconnected';
        document.getElementById('connectionStatus').innerHTML = '🔴 Ошибка';
    });
    socket.on('guests-update', (count) => {
        document.getElementById('guestCount').innerText = count;
    });
    socket.on('host-replaced', () => {
        alert('Другой организатор подключился к пульту');
        location.reload();
    });
</script>
</body>
</html>
