<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lights Stick App — Пульт</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #0a0f1e;
            margin: 0;
            padding: 16px;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: #11161f;
            border-radius: 48px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 8px;
            background: linear-gradient(135deg, #aaccff, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sub {
            color: #8e9aaf;
            margin-bottom: 20px;
        }
        .info-box {
            background: #0c1018;
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .guest-url {
            background: #00000066;
            padding: 12px;
            border-radius: 60px;
            font-size: 0.75rem;
            word-break: break-all;
            margin: 10px 0;
        }
        .main-btn {
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            width: 100%;
            cursor: pointer;
            margin: 12px 0;
            transition: transform 0.05s;
        }
        .main-btn:active {
            transform: scale(0.98);
        }
        .start-btn { background: #00c853; }
        .thank-btn { background: #ff3b30; }
        .strobe-btn {
            background: #ff2d55;
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            width: 100%;
            cursor: pointer;
            margin: 16px 0;
            transition: all 0.1s;
        }
        .strobe-btn.active {
            background: #ff0a3a;
            animation: pulse 0.8s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
        .counter {
            background: #00000044;
            border-radius: 60px;
            padding: 14px;
            margin-top: 16px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .status {
            margin-top: 16px;
            padding: 10px;
            border-radius: 28px;
            font-size: 0.85rem;
        }
        .status.connected {
            background: #1e3a2f;
            color: #4cff9e;
        }
        .status.disconnected {
            background: #3a1e1e;
            color: #ff6b6b;
        }
        .status.strobe {
            background: #ff2d55;
            color: white;
            animation: pulse 1s infinite;
        }
        hr {
            margin: 20px 0;
            border-color: #2a3a50;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✨ Lights Stick App</h1>
    <div class="sub">Пульт организатора</div>

    <div class="info-box">
        <div>🔗 Ссылка для гостей:</div>
        <div class="guest-url" id="guestUrlDisplay">Загрузка...</div>
        <div style="font-size: 0.7rem; margin-top: 8px;">
            📱 Гости открывают эту ссылку в браузере<br>
            (работает через мобильный интернет)
        </div>
    </div>

    <button class="main-btn start-btn" id="startShowBtn">🎬 НАЧИНАЕМ (убрать текст и градиент)</button>
    <button class="main-btn thank-btn" id="thankYouBtn">❤️ СКАЗАТЬ СПАСИБО</button>

    <hr>

    <button class="strobe-btn" id="strobeBtn">⚡ СТРОБОСКОП</button>

    <div class="counter">
        📱 Гостей в зале: <span id="guestCount">0</span>
    </div>
    <div id="connectionStatus" class="status disconnected">⚡ Подключение к серверу...</div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
    let isStrobeActive = false;
    
    // Отображаем ссылку для гостей
    const guestUrl = window.location.origin + '/guest.html';
    document.getElementById('guestUrlDisplay').innerText = guestUrl;
    
    // Регистрация хоста
    socket.emit('iam-host');
    
    function toggleStrobe() {
        if (isStrobeActive) {
            socket.emit('strobe-off');
            isStrobeActive = false;
            document.getElementById('strobeBtn').classList.remove('active');
            document.getElementById('connectionStatus').classList.remove('strobe');
            document.getElementById('connectionStatus').innerHTML = '🟢 Подключено к серверу';
        } else {
            socket.emit('strobe-on');
            isStrobeActive = true;
            document.getElementById('strobeBtn').classList.add('active');
            document.getElementById('connectionStatus').classList.add('strobe');
            document.getElementById('connectionStatus').innerHTML = '⚡ СТРОБОСКОП АКТИВЕН ⚡';
        }
    }
    
    // Обработчики кнопок
    document.getElementById('strobeBtn').addEventListener('click', toggleStrobe);
    document.getElementById('startShowBtn').addEventListener('click', () => {
        socket.emit('start-show');
    });
    document.getElementById('thankYouBtn').addEventListener('click', () => {
        socket.emit('thank-you');
    });
    
    // События сокета
    socket.on('connect', () => {
        document.getElementById('connectionStatus').className = 'status connected';
        document.getElementById('connectionStatus').innerHTML = '🟢 Подключено к серверу';
        socket.emit('iam-host');
    });
    
    socket.on('connect_error', () => {
        document.getElementById('connectionStatus').className = 'status disconnected';
        document.getElementById('connectionStatus').innerHTML = '🔴 Ошибка подключения';
    });
    
    socket.on('host-confirmed', () => {
        console.log('✅ Хост подтверждён');
    });
    
    socket.on('guests-count', (count) => {
        document.getElementById('guestCount').innerText = count;
        console.log('👥 Гостей в зале:', count);
    });
</script>
</body>
</html>
