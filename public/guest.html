<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>РГУТИС — Световое шоу</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0a1a3a, #1a2a4a);
            animation: gradientShift 8s ease infinite alternate;
            color: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            transition: background-color 0.05s linear;
        }
        @keyframes gradientShift {
            0% { background: linear-gradient(135deg, #0a1a3a, #1a2a4a); }
            50% { background: linear-gradient(135deg, #1a2a5a, #2a3a6a); }
            100% { background: linear-gradient(135deg, #2a3a6a, #1a2a4a); }
        }
        .container {
            max-width: 90vw;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 2rem;
            text-align: center;
        }
        .code-input {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 24px 0;
        }
        .code-input input {
            font-size: 2rem;
            width: 120px;
            text-align: center;
            padding: 12px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.9);
            font-family: monospace;
            font-weight: bold;
        }
        button {
            background: #ff9500;
            border: none;
            border-radius: 60px;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .message-text {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            line-height: 1.3;
            font-weight: 800;
            margin-top: 20px;
        }
        .connected-status {
            margin-top: 16px;
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .footer-tip {
            position: fixed;
            bottom: 16px;
            font-size: 0.7rem;
            opacity: 0.5;
            left: 0;
            right: 0;
            text-align: center;
        }
        .strobe-active-warning {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(255,45,85,0.8);
            padding: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>
<div class="container" id="joinScreen">
    <div>🎫 Введите 4-значный код</div>
    <div class="code-input">
        <input type="text" id="roomCodeInput" maxlength="4" placeholder="0000">
    </div>
    <button id="joinBtn">Подключиться</button>
    <div class="connected-status" id="statusMsg">Введите код, чтобы присоединиться к шоу</div>
</div>

<div class="container" id="showScreen" style="display:none;">
    <div class="message-text" id="mainMessage">💙 РГУТИС ЭТО Я, РГУТИС ЭТО МЫ 💙</div>
    <div class="connected-status" id="liveStatus">✨ вы в шоу</div>
</div>
<div class="footer-tip" id="footerTip">твой экран — часть шоу</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
    
    const messages = [
        "✨ РГУТИС ЭТО Я, РГУТИС ЭТО МЫ ✨",
        "🎤 НЕ ЗАБУДЬ ГРОМКО ПОДДЕРЖИВАТЬ ВЫСТУПАЮЩИХ 🎤",
        "💫 ТЫ ВЫГЛЯДИШЬ СНОГСШИБАТЕЛЬНО 💫",
        "😊 ХОРОШЕГО НАСТРОЕНИЯ! 😊",
        "🚀 МЫ СКОРО НАЧНЕМ 🚀"
    ];
    
    let currentIndex = 0;
    let currentRoomCode = null;
    let autoInterval = null;
    let strobeInterval = null;
    let originalBackground = null;
    
    function updateMessage() {
        const msgEl = document.getElementById('mainMessage');
        if (msgEl) {
            msgEl.style.opacity = '0';
            setTimeout(() => {
                msgEl.innerText = messages[currentIndex];
                msgEl.style.opacity = '1';
            }, 150);
        }
    }
    
    function startAutoSwitch() {
        if (autoInterval) clearInterval(autoInterval);
        autoInterval = setInterval(() => {
            if (currentRoomCode) {
                currentIndex = (currentIndex + 1) % messages.length;
                updateMessage();
            }
        }, 60000);
    }
    
    function stopStrobe() {
        if (strobeInterval) {
            clearInterval(strobeInterval);
            strobeInterval = null;
        }
        // Возвращаем нормальный фон (убираем все инлайн-стили)
        document.body.style.backgroundColor = '';
        document.body.style.backgroundImage = '';
        document.body.style.animation = 'gradientShift 8s ease infinite alternate';
        // Убираем предупреждение, если есть
        const warning = document.getElementById('strobeWarning');
        if (warning) warning.remove();
    }
    
    function startStrobe() {
        stopStrobe();
        // Сохраняем текущий фон для восстановления после стробоскопа
        originalBackground = document.body.style.backgroundColor;
        // Убираем градиент и анимацию
        document.body.style.backgroundImage = 'none';
        document.body.style.animation = 'none';
        
        let isWhite = true;
        strobeInterval = setInterval(() => {
            document.body.style.backgroundColor = isWhite ? '#ffffff' : '#000000';
            isWhite = !isWhite;
        }, 100); // 10 Гц (10 раз в секунду)
        
        // Добавляем предупреждение
        if (!document.getElementById('strobeWarning')) {
            const warning = document.createElement('div');
            warning.id = 'strobeWarning';
            warning.className = 'strobe-active-warning';
            warning.innerText = '⚡ СТРОБОСКОП АКТИВЕН ⚡';
            document.body.appendChild(warning);
        }
    }
    
    // Поддержка кода из URL
    const urlParams = new URLSearchParams(window.location.search);
    const urlCode = urlParams.get('code');
    if (urlCode && urlCode.length === 4 && /^\d+$/.test(urlCode)) {
        document.getElementById('roomCodeInput').value = urlCode;
        joinRoom(urlCode);
    }
    
    document.getElementById('joinBtn').onclick = () => {
        const code = document.getElementById('roomCodeInput').value.trim();
        if (code.length === 4 && /^\d+$/.test(code)) {
            joinRoom(code);
        } else {
            document.getElementById('statusMsg').innerText = '❌ Введите 4 цифры';
        }
    };
    
    function joinRoom(code) {
        currentRoomCode = code;
        socket.emit('guest-join', { code });
        document.getElementById('joinScreen').style.display = 'none';
        document.getElementById('showScreen').style.display = 'block';
        document.getElementById('statusMsg').innerText = '🔄 подключение...';
        startAutoSwitch();
    }
    
    socket.on('join-success', (data) => {
        document.getElementById('liveStatus').innerHTML = '✅ вы в шоу';
        // Если с сервера пришёл активный стробоскоп — запускаем
        if (data && data.currentMode === 'strobe') {
            startStrobe();
        } else if (data && data.currentColor) {
            document.body.style.backgroundColor = data.currentColor;
            setTimeout(() => {
                if (currentRoomCode && document.body.style.backgroundColor !== '') {
                    document.body.style.backgroundColor = '';
                    document.body.style.animation = 'gradientShift 8s ease infinite alternate';
                }
            }, 300);
        }
    });
    
    socket.on('join-error', () => {
        alert('Неверный код комнаты');
        document.getElementById('joinScreen').style.display = 'block';
        document.getElementById('showScreen').style.display = 'none';
        currentRoomCode = null;
        if (autoInterval) clearInterval(autoInterval);
        stopStrobe();
    });
    
    socket.on('host-left', () => {
        alert('Организатор завершил шоу');
        document.getElementById('joinScreen').style.display = 'block';
        document.getElementById('showScreen').style.display = 'none';
        currentRoomCode = null;
        if (autoInterval) clearInterval(autoInterval);
        stopStrobe();
    });
    
    // Применение цвета от хоста (останавливает стробоскоп)
    socket.on('color-change', ({ color }) => {
        stopStrobe();
        document.body.style.backgroundColor = color;
        document.body.style.backgroundImage = 'none';
        document.body.style.animation = 'none';
        setTimeout(() => {
            if (currentRoomCode && document.body.style.backgroundColor === color) {
                document.body.style.backgroundColor = '';
                document.body.style.backgroundImage = '';
                document.body.style.animation = 'gradientShift 8s ease infinite alternate';
            }
        }, 300);
    });
    
    // Запуск стробоскопа
    socket.on('strobe-start', () => {
        startStrobe();
    });
    
    // Остановка стробоскопа
    socket.on('strobe-stop', () => {
        stopStrobe();
    });
</script>
</body>
</html>
