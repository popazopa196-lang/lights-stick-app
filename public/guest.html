<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>РГУТИС — Световое шоу</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #0a1a3a, #1a2a4a);
            animation: gradientShift 8s ease infinite alternate;
            color: white;
            padding: 2rem;
            transition: none;
        }
        @keyframes gradientShift {
            0% { background: linear-gradient(135deg, #0a1a3a, #1a2a4a); }
            100% { background: linear-gradient(135deg, #2a3a6a, #1a2a4a); }
        }
        .container {
            max-width: 90vw;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 2rem;
            text-align: center;
        }
        .message-text {
            font-size: clamp(1.8rem, 7vw, 3rem);
            font-weight: 800;
        }
        .message-text.hidden {
            display: none;
        }
        .footer-tip {
            position: fixed;
            bottom: 16px;
            font-size: 0.7rem;
            opacity: 0.5;
            left: 0;
            right: 0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="message-text" id="mainMessage">💙 РГУТИС ЭТО Я, РГУТИС ЭТО МЫ 💙</div>
</div>
<div class="footer-tip">твой экран — часть шоу</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
    
    // Фразы
    const messages = [
        "✨ РГУТИС ЭТО Я, РГУТИС ЭТО МЫ ✨",
        "🎤 НЕ ЗАБУДЬ ГРОМКО ПОДДЕРЖИВАТЬ ВЫСТУПАЮЩИХ 🎤",
        "💫 ТЫ ВЫГЛЯДИШЬ СНОГСШИБАТЕЛЬНО 💫",
        "😊 ХОРОШЕГО НАСТРОЕНИЯ! 😊",
        "🚀 МЫ СКОРО НАЧНЕМ 🚀"
    ];
    
    let currentIndex = 0;
    let autoInterval = null;
    let strobeInterval = null;
    let isStrobeOn = false;
    let isShowMode = false;
    const messageEl = document.getElementById('mainMessage');
    const bodyEl = document.body;
    
    // Автосмена фраз
    function startAutoSwitch() {
        if (autoInterval) clearInterval(autoInterval);
        autoInterval = setInterval(() => {
            if (!isShowMode) {
                currentIndex = (currentIndex + 1) % messages.length;
                messageEl.style.opacity = '0';
                setTimeout(() => {
                    messageEl.innerText = messages[currentIndex];
                    messageEl.style.opacity = '1';
                }, 150);
            }
        }, 60000);
    }
    
    // ПОЛНАЯ ОСТАНОВКА СТРОБОСКОПА
    function stopStrobe() {
        if (strobeInterval) {
            clearInterval(strobeInterval);
            strobeInterval = null;
        }
        isStrobeOn = false;
        // Возвращаем нормальный вид
        if (!isShowMode) {
            bodyEl.style.backgroundColor = '';
            bodyEl.style.backgroundImage = '';
            bodyEl.style.animation = 'gradientShift 8s ease infinite alternate';
        } else {
            bodyEl.style.backgroundColor = '#0a1a3a';
            bodyEl.style.backgroundImage = 'none';
            bodyEl.style.animation = 'none';
        }
    }
    
    // ЗАПУСК СТРОБОСКОПА (мигает)
    function startStrobe() {
        // Сначала останавливаем текущий
        if (strobeInterval) {
            clearInterval(strobeInterval);
            strobeInterval = null;
        }
        // Убираем градиент
        bodyEl.style.backgroundImage = 'none';
        bodyEl.style.animation = 'none';
        
        let isWhite = true;
        strobeInterval = setInterval(() => {
            bodyEl.style.backgroundColor = isWhite ? '#ffffff' : '#000000';
            isWhite = !isWhite;
        }, 100);
        isStrobeOn = true;
    }
    
    // РЕЖИМ "НАЧИНАЕМ"
    function startShow() {
        isShowMode = true;
        messageEl.classList.add('hidden');
        stopStrobe();
        bodyEl.style.backgroundColor = '#0a1a3a';
        bodyEl.style.backgroundImage = 'none';
        bodyEl.style.animation = 'none';
    }
    
    // РЕЖИМ "СПАСИБО"
    function showThankYou() {
        isShowMode = false;
        messageEl.classList.remove('hidden');
        messageEl.innerText = "❤️ СПАСИБО ЗА НЕВЕРОЯТНЫЕ ЭМОЦИИ ❤️";
        stopStrobe();
        bodyEl.style.backgroundColor = '';
        bodyEl.style.backgroundImage = '';
        bodyEl.style.animation = 'gradientShift 8s ease infinite alternate';
        setTimeout(() => {
            if (!isShowMode) {
                currentIndex = 0;
                messageEl.innerText = messages[currentIndex];
                startAutoSwitch();
            }
        }, 5000);
    }
    
    // Регистрация гостя
    socket.emit('iam-guest');
    
    socket.on('connect', () => {
        console.log('✅ Подключено');
        socket.emit('iam-guest');
        startAutoSwitch();
    });
    
    socket.on('guest-confirmed', () => {
        console.log('✅ Зарегистрирован');
    });
    
    socket.on('start-show', () => {
        console.log('🎬 start-show');
        startShow();
    });
    
    socket.on('thank-you', () => {
        console.log('❤️ thank-you');
        showThankYou();
    });
    
    // СТРОБОСКОП — ПРЯМЫЕ КОМАНДЫ
    socket.on('strobe-start', () => {
        console.log('⚡ strobe-start');
        startStrobe();
    });
    
    socket.on('strobe-stop', () => {
        console.log('⚡ strobe-stop');
        stopStrobe();
    });
</script>
</body>
</html>
