<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>РГУТИС — Световое шоу</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0a1a3a, #1a2a4a);
            animation: gradientShift 8s ease infinite alternate;
            color: rgba(255, 255, 255, 0.95);
            padding: 2rem;
        }
        @keyframes gradientShift {
            0% { background: linear-gradient(135deg, #0a1a3a, #1a2a4a); }
            50% { background: linear-gradient(135deg, #1a2a5a, #2a3a6a); }
            100% { background: linear-gradient(135deg, #2a3a6a, #1a2a4a); }
        }
        .container {
            max-width: 90vw;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 2rem;
            text-align: center;
        }
        .code-input {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 24px 0;
        }
        .code-input input {
            font-size: 2rem;
            width: 120px;
            text-align: center;
            padding: 12px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.9);
            font-family: monospace;
            font-weight: bold;
        }
        button {
            background: #ff9500;
            border: none;
            border-radius: 60px;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .message-text {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            line-height: 1.3;
            font-weight: 800;
            margin-top: 20px;
        }
        .connected-status {
            margin-top: 16px;
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .footer-tip {
            position: fixed;
            bottom: 16px;
            font-size: 0.7rem;
            opacity: 0.5;
            left: 0;
            right: 0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container" id="joinScreen">
    <div>🎫 Введите 4-значный код</div>
    <div class="code-input">
        <input type="text" id="roomCodeInput" maxlength="4" placeholder="0000" style="font-size:2rem;width:120px;">
    </div>
    <button id="joinBtn">Подключиться</button>
    <div class="connected-status" id="statusMsg">Введите код, чтобы присоединиться к шоу</div>
</div>

<div class="container" id="showScreen" style="display:none;">
    <div class="message-text" id="mainMessage">💙 РГУТИС ЭТО Я, РГУТИС ЭТО МЫ 💙</div>
    <div class="connected-status" id="liveStatus">✨ вы в шоу</div>
</div>
<div class="footer-tip" id="footerTip">твой экран — часть шоу</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
    
    // Фразы гостя (меняются автоматически каждые 60 секунд)
    const messages = [
        "✨ РГУТИС ЭТО Я, РГУТИС ЭТО МЫ ✨",
        "🎤 НЕ ЗАБУДЬ ГРОМКО ПОДДЕРЖИВАТЬ ВЫСТУПАЮЩИХ 🎤",
        "💫 ТЫ ВЫГЛЯДИШЬ СНОГСШИБАТЕЛЬНО 💫",
        "😊 ХОРОШЕГО НАСТРОЕНИЯ! 😊",
        "🚀 МЫ СКОРО НАЧНЕМ 🚀"
    ];
    
    let currentIndex = 0;
    let currentRoomCode = null;
    
    function updateMessage() {
        const msgEl = document.getElementById('mainMessage');
        if (msgEl) {
            msgEl.style.opacity = '0';
            setTimeout(() => {
                msgEl.innerText = messages[currentIndex];
                msgEl.style.opacity = '1';
            }, 150);
        }
    }
    
    // Автосмена фраз каждые 60 секунд
    setInterval(() => {
        if (currentRoomCode) {
            currentIndex = (currentIndex + 1) % messages.length;
            updateMessage();
        }
    }, 60000);
    
    // Поддержка кода из URL (если перешли по ссылке с ?code=1234)
    const urlParams = new URLSearchParams(window.location.search);
    const urlCode = urlParams.get('code');
    if (urlCode && urlCode.length === 4 && /^\d+$/.test(urlCode)) {
        document.getElementById('roomCodeInput').value = urlCode;
        joinRoom(urlCode);
    }
    
    document.getElementById('joinBtn').onclick = () => {
        const code = document.getElementById('roomCodeInput').value.trim();
        if (code.length === 4 && /^\d+$/.test(code)) {
            joinRoom(code);
        } else {
            document.getElementById('statusMsg').innerText = '❌ Введите 4 цифры';
        }
    };
    
    function joinRoom(code) {
        currentRoomCode = code;
        socket.emit('guest-join', { roomCode: code });
        document.getElementById('joinScreen').style.display = 'none';
        document.getElementById('showScreen').style.display = 'block';
        document.getElementById('statusMsg').innerText = '🔄 подключение...';
    }
    
    socket.on('join-success', () => {
        document.getElementById('liveStatus').innerHTML = '✅ вы в шоу';
    });
    
    socket.on('join-error', () => {
        alert('Неверный код комнаты');
        document.getElementById('joinScreen').style.display = 'block';
        document.getElementById('showScreen').style.display = 'none';
        currentRoomCode = null;
    });
    
    socket.on('command', (cmd) => {
        if (cmd.mode === 'color') {
            document.body.style.backgroundColor = cmd.value;
            setTimeout(() => {
                document.body.style.backgroundColor = '';
            }, 200);
        } else if (cmd.mode === 'flash') {
            const originalBg = document.body.style.backgroundColor;
            document.body.style.backgroundColor = '#ffffff';
            setTimeout(() => {
                document.body.style.backgroundColor = originalBg;
            }, cmd.value);
        }
    });
</script>
</body>
</html>
