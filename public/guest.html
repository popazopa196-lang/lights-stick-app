<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>РГУТИС — Световое шоу</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a1a3a, #1a2a4a);
            animation: gradientShift 8s ease infinite alternate;
            color: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            margin: 0;
        }
        @keyframes gradientShift {
            0% { background: linear-gradient(135deg, #0a1a3a, #1a2a4a); }
            100% { background: linear-gradient(135deg, #2a3a6a, #1a2a4a); }
        }
        .container {
            max-width: 90vw;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        /* Режим шоу: убираем фон, blur и текст */
        body.show-mode .container {
            background: transparent !important;
            backdrop-filter: none !important;
            padding: 0 !important;
        }
        body.show-mode {
            background: #0a1a3a !important;
            animation: none !important;
        }
        .message-text {
            font-size: clamp(1.8rem, 7vw, 3rem);
            line-height: 1.3;
            font-weight: 800;
            transition: opacity 0.3s ease;
        }
        .message-text.hidden {
            display: none;
        }
        .footer-tip {
            position: fixed;
            bottom: 16px;
            font-size: 0.7rem;
            opacity: 0.5;
            left: 0;
            right: 0;
            text-align: center;
        }
        body.show-mode .footer-tip {
            opacity: 0.2;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="message-text" id="mainMessage">💙 РГУТИС ЭТО Я, РГУТИС ЭТО МЫ 💙</div>
</div>
<div class="footer-tip">твой экран — часть шоу</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
    
    const messages = [
        "✨ РГУТИС ЭТО Я, РГУТИС ЭТО МЫ ✨",
        "🎤 НЕ ЗАБУДЬ ГРОМКО ПОДДЕРЖИВАТЬ ВЫСТУПАЮЩИХ 🎤",
        "💫 ТЫ ВЫГЛЯДИШЬ СНОГСШИБАТЕЛЬНО 💫",
        "😊 ХОРОШЕГО НАСТРОЕНИЯ! 😊",
        "🚀 МЫ СКОРО НАЧНЕМ 🚀"
    ];
    
    let currentIndex = 0;
    let autoInterval = null;
    let strobeInterval = null;
    let textVisible = true;
    const messageEl = document.getElementById('mainMessage');
    const bodyEl = document.body;
    
    // Автосмена фраз
    function updateMessage() {
        if (textVisible && messageEl && !messageEl.classList.contains('hidden')) {
            messageEl.style.opacity = '0';
            setTimeout(() => {
                messageEl.innerText = messages[currentIndex];
                messageEl.style.opacity = '1';
            }, 150);
        }
    }
    
    function startAutoSwitch() {
        if (autoInterval) clearInterval(autoInterval);
        autoInterval = setInterval(() => {
            if (textVisible && !bodyEl.classList.contains('show-mode')) {
                currentIndex = (currentIndex + 1) % messages.length;
                updateMessage();
            }
        }, 60000);
    }
    
    // ПОЛНАЯ ОСТАНОВКА СТРОБОСКОПА
    function stopStrobe() {
        if (strobeInterval) {
            clearInterval(strobeInterval);
            strobeInterval = null;
        }
        // Возвращаем нормальное состояние
        if (!bodyEl.classList.contains('show-mode')) {
            bodyEl.style.backgroundColor = '';
            bodyEl.style.backgroundImage = '';
            bodyEl.style.animation = 'gradientShift 8s ease infinite alternate';
        } else {
            bodyEl.style.backgroundColor = '#0a1a3a';
            bodyEl.style.backgroundImage = 'none';
            bodyEl.style.animation = 'none';
        }
    }
    
    // ЗАПУСК СТРОБОСКОПА (мигает белым и чёрным)
    function startStrobe() {
        stopStrobe(); // Останавливаем предыдущий режим
        // Убираем градиент и анимацию
        bodyEl.style.backgroundImage = 'none';
        bodyEl.style.animation = 'none';
        let isWhite = true;
        strobeInterval = setInterval(() => {
            bodyEl.style.backgroundColor = isWhite ? '#ffffff' : '#000000';
            isWhite = !isWhite;
        }, 100); // 10 раз в секунду
    }
    
    // РЕЖИМ "НАЧИНАЕМ" (убираем текст, градиент, полупрозрачный фон)
    function startShow() {
        textVisible = false;
        messageEl.classList.add('hidden');
        bodyEl.classList.add('show-mode');
        stopStrobe(); // Если стробоскоп был включён — выключаем
        bodyEl.style.backgroundColor = '#0a1a3a';
        bodyEl.style.backgroundImage = 'none';
        bodyEl.style.animation = 'none';
    }
    
    // РЕЖИМ "СПАСИБО" (показываем текст, возвращаем градиент)
    function showThankYou() {
        textVisible = true;
        messageEl.classList.remove('hidden');
        bodyEl.classList.remove('show-mode');
        messageEl.innerText = "❤️ СПАСИБО ЗА НЕВЕРОЯТНЫЕ ЭМОЦИИ ❤️";
        bodyEl.style.backgroundColor = '';
        bodyEl.style.backgroundImage = '';
        bodyEl.style.animation = 'gradientShift 8s ease infinite alternate';
        setTimeout(() => {
            if (textVisible && !bodyEl.classList.contains('show-mode')) {
                currentIndex = 0;
                updateMessage();
                startAutoSwitch();
            }
        }, 5000);
    }
    
    // Регистрация гостя
    socket.emit('iam-guest');
    
    socket.on('connect', () => {
        console.log('✅ Гость: подключено к серверу');
        socket.emit('iam-guest');
        startAutoSwitch();
    });
    
    socket.on('guest-confirmed', () => {
        console.log('✅ Гость зарегистрирован');
    });
    
    socket.on('start-show', () => {
        console.log('🎬 Получена команда: start-show');
        startShow();
    });
    
    socket.on('thank-you', () => {
        console.log('❤️ Получена команда: thank-you');
        showThankYou();
    });
    
    // ЦВЕТА УБРАНЫ — ничего не делаем
    socket.on('color-change', (color) => {
        console.log('🎨 Цвет получен, но отключён:', color);
        // Ничего не делаем
    });
    
    // СТРОБОСКОП — РАБОТАЕТ
    socket.on('strobe-start', () => {
        console.log('⚡ Получена команда: strobe-start');
        startStrobe();
    });
    
    socket.on('strobe-stop', () => {
        console.log('⚡ Получена команда: strobe-stop');
        stopStrobe();
    });
</script>
</body>
</html>
