<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>РГУТИС — Световое шоу</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
            font-weight: bold;
            text-align: center;
            background: linear-gradient(135deg, #0a1a3a, #1a2a4a);
            animation: gradientShift 8s ease infinite alternate;
            color: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            transition: background-color 0.2s ease;
        }
        @keyframes gradientShift {
            0% { background: linear-gradient(135deg, #0a1a3a, #1a2a4a); }
            50% { background: linear-gradient(135deg, #1a2a5a, #2a3a6a); }
            100% { background: linear-gradient(135deg, #2a3a6a, #1a2a4a); }
        }
        .message-container {
            max-width: 90vw;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
        }
        .message-text {
            font-size: clamp(1.8rem, 8vw, 3.5rem);
            line-height: 1.3;
            font-weight: 800;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            letter-spacing: 0.02em;
            transition: opacity 0.3s ease;
        }
        .heart {
            margin-top: 2rem;
            font-size: 2rem;
            opacity: 0.7;
            animation: gentlePulse 1.5s infinite;
        }
        @keyframes gentlePulse {
            0% { opacity: 0.5; transform: scale(1);}
            100% { opacity: 1; transform: scale(1.05);}
        }
        .footer-tip {
            position: fixed;
            bottom: 16px;
            font-size: 0.75rem;
            opacity: 0.5;
            left: 0;
            right: 0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="message-container">
    <div class="message-text" id="mainMessage">
        💙 РГУТИС ЭТО Я, РГУТИС ЭТО МЫ 💙
    </div>
    <div class="heart">
        ✨ 💙 🤍 ✨
    </div>
</div>
<div class="footer-tip">
    твой экран — часть шоу
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    // ===== ВАШИ ФРАЗЫ (меняйте здесь) =====
    const messages = [
        "✨ РГУТИС ЭТО Я, РГУТИС ЭТО МЫ ✨",
        "🎤 НЕ ЗАБУДЬ ГРОМКО ПОДДЕРЖИВАТЬ ВЫСТУПАЮЩИХ 🎤",
        "💫 ТЫ ВЫГЛЯДИШЬ СНОГСШИБАТЕЛЬНО 💫",
        "😊 ХОРОШЕГО НАСТРОЕНИЯ! 😊",
        "🚀 МЫ СКОРО НАЧНЕМ 🚀"
    ];
    // =====================================

    let currentIndex = 0;
    const messageElement = document.getElementById('mainMessage');

    function updateMessage() {
        messageElement.style.opacity = '0';
        setTimeout(() => {
            messageElement.innerText = messages[currentIndex];
            messageElement.style.opacity = '1';
        }, 150);
    }

    // Автоматическая смена каждые 60 секунд
    setInterval(() => {
        currentIndex = (currentIndex + 1) % messages.length;
        updateMessage();
    }, 60000);

    // Подключение к серверу (только для счётчика, цвета не трогаем)
    const socket = io();

    socket.on('command', (cmd) => {
        // Если хотите добавить управление цветом от хоста — раскомментируйте
        // if (cmd.mode === 'color') {
        //     document.body.style.backgroundColor = cmd.value;
        // }
        console.log('Команда от хоста (игнорируем):', cmd);
    });
</script>
</body>
</html>
