<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>РГУТИС — Световое шоу</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #0a1a3a, #1a2a4a);
            animation: gradientShift 8s ease infinite alternate;
            color: white;
            padding: 2rem;
            transition: background-color 0.05s linear;
        }
        @keyframes gradientShift {
            0% { background: linear-gradient(135deg, #0a1a3a, #1a2a4a); }
            100% { background: linear-gradient(135deg, #2a3a6a, #1a2a4a); }
        }
        body.show-mode {
            animation: none;
            background: #000000 !important;
        }
        .container {
            max-width: 90vw;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 2rem;
            text-align: center;
        }
        body.show-mode .container {
            background: transparent;
            backdrop-filter: none;
        }
        .message-text {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            font-weight: 800;
            transition: opacity 0.2s;
        }
        .message-text.hidden {
            display: none;
        }
        .status {
            margin-top: 20px;
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .footer-tip {
            position: fixed;
            bottom: 16px;
            font-size: 0.7rem;
            opacity: 0.5;
            left: 0;
            right: 0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="message-text" id="mainMessage">💙 РГУТИС ЭТО Я, РГУТИС ЭТО МЫ 💙</div>
    <div class="status" id="statusMsg">✨ подключение к шоу...</div>
</div>
<div class="footer-tip">твой экран — часть шоу</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
    const messages = [
        "✨ РГУТИС ЭТО Я, РГУТИС ЭТО МЫ ✨",
        "🎤 НЕ ЗАБУДЬ ГРОМКО ПОДДЕРЖИВАТЬ ВЫСТУПАЮЩИХ 🎤",
        "💫 ТЫ ВЫГЛЯДИШЬ СНОГСШИБАТЕЛЬНО 💫",
        "😊 ХОРОШЕГО НАСТРОЕНИЯ! 😊",
        "🚀 МЫ СКОРО НАЧНЕМ 🚀"
    ];
    
    let currentIndex = 0;
    let autoInterval = null;
    let strobeInterval = null;
    let thankYouTimeout = null;
    let isShowMode = false;
    let currentColor = null;
    
    const messageEl = document.getElementById('mainMessage');
    const statusEl = document.getElementById('statusMsg');
    const bodyEl = document.body;
    
    function updateMessage() {
        if (!isShowMode && messageEl && !messageEl.classList.contains('hidden')) {
            messageEl.style.opacity = '0';
            setTimeout(() => {
                messageEl.innerText = messages[currentIndex];
                messageEl.style.opacity = '1';
            }, 120);
        }
    }
    
    function startAutoSwitch() {
        if (autoInterval) clearInterval(autoInterval);
        autoInterval = setInterval(() => {
            if (!isShowMode && !thankYouTimeout) {
                currentIndex = (currentIndex + 1) % messages.length;
                updateMessage();
            }
        }, 60000);
    }
    
    function stopStrobe() {
        if (strobeInterval) {
            clearInterval(strobeInterval);
            strobeInterval = null;
        }
        if (isShowMode) {
            bodyEl.style.backgroundColor = currentColor || '#000000';
        } else {
            bodyEl.style.backgroundColor = '';
            bodyEl.style.backgroundImage = '';
            bodyEl.style.animation = 'gradientShift 8s ease infinite alternate';
        }
    }
    
    function startStrobe() {
        if (strobeInterval) stopStrobe();
        bodyEl.style.backgroundImage = 'none';
        bodyEl.style.animation = 'none';
        let white = true;
        strobeInterval = setInterval(() => {
            bodyEl.style.backgroundColor = white ? '#ffffff' : '#000000';
            white = !white;
        }, 80);
    }
    
    function setColor(color) {
        if (strobeInterval) stopStrobe();
        currentColor = color;
        bodyEl.style.backgroundColor = color;
        if (!isShowMode) {
            setTimeout(() => {
                if (!isShowMode && !strobeInterval && bodyEl.style.backgroundColor === color) {
                    bodyEl.style.backgroundColor = '';
                    bodyEl.style.backgroundImage = '';
                    bodyEl.style.animation = 'gradientShift 8s ease infinite alternate';
                }
            }, 300);
        }
    }
    
    function showThankYou() {
        if (thankYouTimeout) clearTimeout(thankYouTimeout);
        const originalText = messageEl.innerText;
        const wasHidden = messageEl.classList.contains('hidden');
        messageEl.classList.remove('hidden');
        messageEl.innerText = "💖 СПАСИБО ЗА НЕВЕРОЯТНЫЕ ЭМОЦИИ 💖";
        thankYouTimeout = setTimeout(() => {
            if (!isShowMode) {
                messageEl.innerText = originalText;
                if (wasHidden) messageEl.classList.add('hidden');
            }
            thankYouTimeout = null;
        }, 5000);
    }
    
    function enterShowMode() {
        isShowMode = true;
        bodyEl.classList.add('show-mode');
        bodyEl.style.backgroundImage = 'none';
        bodyEl.style.animation = 'none';
        bodyEl.style.backgroundColor = '#000000';
        currentColor = '#000000';
        messageEl.classList.add('hidden');
        statusEl.innerHTML = '🎬 ШОУ ИДЁТ!';
        if (autoInterval) clearInterval(autoInterval);
        if (thankYouTimeout) clearTimeout(thankYouTimeout);
    }
    
    socket.emit('guest-connect');
    
    socket.on('connect', () => {
        statusEl.innerHTML = '✅ подключено к серверу';
        socket.emit('guest-connect');
    });
    
    socket.on('guest-connected', (data) => {
        console.log('👤 Гость зарегистрирован, showMode =', data.showModeActive);
        if (data.showModeActive) {
            enterShowMode();
        } else {
            startAutoSwitch();
        }
    });
    
    socket.on('color-change', (color) => setColor(color));
    socket.on('strobe-start', () => startStrobe());
    socket.on('strobe-stop', () => stopStrobe());
    socket.on('show-start', () => enterShowMode());
    socket.on('show-thankyou', () => showThankYou());
    socket.on('host-disconnected', () => {
        statusEl.innerHTML = '⚠️ организатор отключился';
        if (autoInterval) clearInterval(autoInterval);
        stopStrobe();
    });
</script>
</body>
</html>
